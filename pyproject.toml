# Метаданные проекта. Сборка пакета не предполагается — файл нужен, чтобы
# зафиксировать требуемую версию Python: код опирается на возможности, которых
# в более старых нет, и выяснять это при первом запуске на чужом хосте поздно.
[project]
name = "transport-documents-one-s"
version = "1.0.0"
description = "Перенос входящих УПД из Saby в поступления доп. расходов 1С"
requires-python = ">=3.11"

# 3.11 — минимум, а не пожелание:
#   * unittest.TestCase.enterContext в тестах — появился в 3.11;
#   * синтаксис аннотаций `X | None` в рантайме pydantic — с 3.10;
#   * except* и tomllib не используются, поэтому выше 3.11 не требуется.
# Проверено на 3.14.4.
